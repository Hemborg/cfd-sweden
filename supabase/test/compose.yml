# Synthetic local integration stack, not a production deployment recipe.
name: cfd-platform-test
services:
  db:
    image: postgres:17.10-bookworm
    mem_limit: 256m
    environment:
      POSTGRES_DB: cfd_platform_test
      POSTGRES_PASSWORD: ${CFD_TEST_DB_PASSWORD}
    ports: ["127.0.0.1:54322:5432"]
    volumes:
      - cfd-test-db:/var/lib/postgresql/data
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cfd_platform_test"]
      interval: 2s
      retries: 30
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    mem_limit: 128m
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1
      GOTRUE_SITE_URL: http://127.0.0.1:3400
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:3400/**,http://127.0.0.1:3402/**
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${CFD_TEST_DB_PASSWORD}@db:5432/cfd_platform_test
      GOTRUE_JWT_SECRET: ${CFD_TEST_JWT_SECRET}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@example.test
      GOTRUE_SMTP_SENDER_NAME: CFD local tests
      GOTRUE_MFA_ENABLED: "true"
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9999/health"]
      interval: 2s
      retries: 30
  rest:
    image: public.ecr.aws/supabase/postgrest:v16.5
    mem_limit: 128m
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${CFD_TEST_DB_PASSWORD}@db:5432/cfd_platform_test
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${CFD_TEST_JWT_SECRET}
      PGRST_DB_MAX_ROWS: 1000
  api:
    image: public.ecr.aws/supabase/kong:2.8.1
    mem_limit: 192m
    depends_on: [auth, rest]
    ports: ["127.0.0.1:54321:8000"]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/test.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"
      KONG_NGINX_WORKER_PROCESSES: 1
      KONG_PROXY_ACCESS_LOG: "off"
    volumes: ["./gateway.yml:/etc/kong/test.yml:ro"]
  mail:
    image: public.ecr.aws/supabase/mailpit:v1.31.3
    mem_limit: 64m
    ports: ["127.0.0.1:54324:8025", "127.0.0.1:54325:1025"]
volumes:
  cfd-test-db:
